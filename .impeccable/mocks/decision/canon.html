<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Language homepage — first viewport sketch</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:1440px;height:900px;overflow:hidden;background:#fff;color:#111827;font-family:"Segoe UI",system-ui,sans-serif}
.nav{height:68px;display:flex;align-items:center;gap:32px;padding:0 80px;border-bottom:1px solid #e5e7eb;font-size:15px}
.nav .logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:22px}
.nav .logo i{width:30px;height:30px;background:#e29b19;border-radius:6px}
.nav .sp{flex:1}
.hero{display:grid;grid-template-columns:1fr 1fr;gap:64px;padding:88px 80px 0}
h1{font-size:60px;line-height:1.05;letter-spacing:-.03em;margin:0 0 22px}
.sub{font-size:20px;line-height:1.5;color:#4b5563;margin:0 0 32px}
.btn{display:inline-block;padding:16px 28px;background:#e29b19;color:#111827;font-weight:700;font-size:18px;border-radius:8px;margin-right:12px}
.btn.o{background:#fff;border:1px solid #d1d5db}
.code{height:360px;background:#0f172a;border-radius:12px}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;padding:64px 80px}
.card{height:150px;border:1px solid #e5e7eb;border-radius:12px;padding:24px}
.card b{display:block;font-size:22px;margin-bottom:8px}
</style></head><body>
<div class="nav"><span class="logo"><i></i>Hive</span><span class="sp"></span><span>Tour</span><span>Docs</span><span>GitHub</span><span>EN / PT</span></div>

<div class="cards"><div class="card"><b>No crashes</b></div><div class="card"><b>Runs everywhere</b></div><div class="card"><b>Batteries included</b></div></div>
